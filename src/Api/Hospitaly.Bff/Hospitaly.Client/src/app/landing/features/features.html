<section class="relative py-24 overflow-hidden">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center mb-16">
      <h2 class="text-3xl sm:text-4xl font-bold text-ink mb-4">
        Everything You Need to <span class="text-primary">Run Your Clinic</span>
      </h2>
      <p class="text-body text-lg max-w-2xl mx-auto">
        A complete suite of tools designed to streamline your healthcare practice
        from appointment scheduling to analytics.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (feature of features; track feature.title) {
        <div #featureCard class="feature-card surface-card p-6 opacity-0 cursor-default">
          <div class="text-4xl mb-4 leading-none">{{ feature.icon }}</div>
          <h3 class="text-lg font-semibold text-ink mb-2">{{ feature.title }}</h3>
          <p class="text-body text-sm leading-relaxed">{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
