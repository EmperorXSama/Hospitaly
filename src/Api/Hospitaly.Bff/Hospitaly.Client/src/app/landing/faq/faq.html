<section id="faq" class="py-20 px-4 sm:py-24">
  <div class="max-w-3xl mx-auto">
    <h2 class="text-3xl sm:text-4xl font-bold text-center mb-4 text-ink">
      Frequently Asked Questions
    </h2>
    <p class="text-muted text-center mb-12 sm:mb-16 max-w-2xl mx-auto text-sm sm:text-base">
      Everything you need to know about Hospitaly. Can&rsquo;t find what you&rsquo;re looking for? Contact our support team.
    </p>
    <div class="divide-y border-hairline">
      @for (item of items; track $index) {
        <div class="faq-item">
          <button
            class="faq-question"
            (click)="toggle($index)"
            [attr.aria-expanded]="activeIndex() === $index"
          >
            <span>{{ item.question }}</span>
            <svg
              class="chevron"
              [class.rotate-180]="activeIndex() === $index"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div #content class="faq-content">
            <div class="faq-answer">
              {{ item.answer }}
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
