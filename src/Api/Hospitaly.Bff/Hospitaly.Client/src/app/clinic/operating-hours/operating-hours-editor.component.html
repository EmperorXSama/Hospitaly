<section class="bg-surface-card border border-hairline rounded-xl p-5 space-y-5">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-on-dark">Weekly Operating Hours</h2>
      <p class="text-sm text-body mt-1">Closed days will not accept appointments.</p>
      <p class="text-xs text-muted mt-1">Resting days can be used later for reduced capacity or break scheduling.</p>
    </div>
    <button
      type="button"
      (click)="copyMondayToWeekdays.emit()"
      class="rounded-md border border-primary/40 px-3 py-2 text-xs font-medium text-primary hover:bg-primary/10 cursor-pointer"
    >
      Copy Monday to weekdays
    </button>
  </div>

  <div class="space-y-3">
    @for (dayForm of daysFormArray.controls; track dayForm.get('day')?.value) {
      <app-operating-hours-day-card [dayForm]="dayForm" />
    }
  </div>
</section>
