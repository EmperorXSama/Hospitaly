<div class="bg-surface-card border border-hairline rounded-xl p-6">
  <div class="flex items-center gap-4">
    <div class="w-10 h-10 rounded-lg bg-surface-elevated flex items-center justify-center flex-shrink-0">
      @switch (icon) {
        @case ('calendar') {
          <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        }
        @case ('users') {
          <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87"/>
            <path d="M16 3.13a4 4 0 010 7.75"/>
          </svg>
        }
        @case ('clock') {
          <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        }
        @case ('trending') {
          <svg class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        }
      }
    </div>
    <div class="flex-1 min-w-0">
      <span class="text-[32px] font-bold text-primary leading-none block">{{ value }}</span>
      <span class="text-body text-sm mt-1 block">{{ label }}</span>
      <span
        class="text-caption mt-1 block font-medium"
        [class.text-accent-emerald]="deltaUp"
        [class.text-accent-rose]="!deltaUp"
      >{{ delta }}</span>
    </div>
  </div>
</div>
