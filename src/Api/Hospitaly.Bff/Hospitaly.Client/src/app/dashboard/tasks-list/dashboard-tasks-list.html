<div class="bg-surface-card border border-hairline rounded-xl p-6">
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-title-md text-on-dark">Current Operations</h2>
    <span class="text-body-sm text-muted">Today</span>
  </div>

  <div class="flex flex-col">
    @for (task of tasks; track task.title; let last = $last) {
      <div class="flex items-center gap-4 py-3" [class.border-b]="!last" [class.border-hairline]="!last">
        <div class="flex-1 min-w-0">
          <span class="text-body-md text-on-dark block truncate">{{ task.title }}</span>
        </div>

        @switch (task.status) {
          @case ('in-progress') {
            <span class="flex-shrink-0 text-caption font-medium bg-accent-blue/20 text-accent-blue rounded-pill px-3 py-0.5">In progress</span>
          }
          @case ('on-hold') {
            <span class="flex-shrink-0 text-caption font-medium bg-warning/20 text-warning rounded-pill px-3 py-0.5">On hold</span>
          }
          @case ('done') {
            <span class="flex-shrink-0 text-caption font-medium bg-accent-emerald/20 text-accent-emerald rounded-pill px-3 py-0.5">Done</span>
          }
          @case ('pending') {
            <span class="flex-shrink-0 text-caption font-medium bg-muted/20 text-muted rounded-pill px-3 py-0.5">Pending</span>
          }
        }

        <span class="flex-shrink-0 text-body-sm text-muted w-14 text-right">{{ task.time }}</span>

        <button class="flex-shrink-0 w-8 h-8 rounded-full bg-surface-elevated flex items-center justify-center text-muted hover:text-on-dark transition-colors cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="2"/>
            <circle cx="12" cy="12" r="2"/>
            <circle cx="12" cy="19" r="2"/>
          </svg>
        </button>
      </div>
    }
  </div>
</div>
