<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm w-80 pointer-events-none">
  @for (n of notifications(); track n.id) {
    <div
      #card
      [attr.data-notification-id]="n.id"
      class="pointer-events-auto surface-card overflow-hidden"
    >
      <div class="flex">
        <div
          class="w-1 flex-shrink-0"
          [class.bg-accent-rose]="n.type === NotificationType.Error"
          [class.bg-accent-emerald]="n.type === NotificationType.Success"
          [class.bg-accent-blue]="n.type === NotificationType.Info"
          [class.bg-warning]="n.type === NotificationType.Warning"
        ></div>
        <div class="flex-1 flex items-start gap-3 p-4">
          <div class="mt-0.5 flex-shrink-0">
            @if (n.type === NotificationType.Error) {
              <svg class="w-5 h-5 text-accent-rose" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
              </svg>
            } @else if (n.type === NotificationType.Success) {
              <svg class="w-5 h-5 text-accent-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            } @else {
              <svg class="w-5 h-5 text-accent-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="16" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12.01" y2="8"/>
              </svg>
            }
          </div>
          <div class="flex-1 min-w-0">
            @if (n.code) {
              <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-0.5">{{ n.code }}</p>
            }
            <p class="text-sm text-body leading-normal">{{ n.message }}</p>
          </div>
          <button
            type="button"
            (click)="dismiss(n.id)"
            class="flex-shrink-0 p-0.5 text-muted hover:text-on-dark transition-colors"
            aria-label="Close"
          >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  }
</div>
