<div class="flex min-h-full">
  <div class="flex-1 p-6 lg:p-8 overflow-y-auto">
    <header class="flex items-start justify-between mb-8">
      <div>
        <h1 class="text-[32px] font-bold leading-tight -tracking-[1px]">Hello, {{ profile()?.userName ?? 'User' }}</h1>
        <p class="text-body text-base mt-1">Track clinic activity, appointments, and patient flow.</p>
      </div>
      <time class="text-muted text-sm flex-shrink-0 hidden sm:block">{{ formattedDate }}</time>
    </header>

    <div #metricsGrid class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
      @for (card of metricCards; track card.label) {
        <app-dashboard-metric-card
          [value]="card.value"
          [label]="card.label"
          [delta]="card.delta"
          [deltaUp]="card.deltaUp"
          [icon]="card.icon"
        />
      }
    </div>

    <div #chartSection class="mb-8">
      <app-dashboard-performance-chart />
    </div>

    <div class="mb-8">
      <app-dashboard-tasks-list />
    </div>
  </div>

  <div class="hidden lg:block flex-shrink-0">
    <app-dashboard-activity-panel />
  </div>
</div>
