<div class="flex flex-col gap-6">
  <nav class="flex items-center gap-2 text-sm">
    <span class="text-muted">User</span>
    <span class="text-muted-soft">/</span>
    <span class="text-muted">User Details</span>
    <span class="text-muted-soft">/</span>
    <span class="text-on-dark font-medium">{{ user().fullName }}</span>
  </nav>

  <div class="bg-surface-card border border-hairline rounded-xl p-6 md:p-8">
    <div class="flex flex-col lg:flex-row lg:items-start gap-6 lg:gap-0">
      <div class="flex flex-col items-center lg:items-center lg:min-w-[220px] lg:max-w-[220px] gap-4">
        <div class="w-20 h-20 rounded-full bg-surface-elevated flex items-center justify-center shrink-0">
          <span class="text-xl font-bold text-muted select-none">{{ initials() }}</span>
        </div>
        <div class="text-center lg:text-center">
          <h2 class="text-title-lg text-on-dark">{{ user().fullName }}</h2>
          <p class="text-body-sm text-muted mt-0.5">{{ user().email }}</p>
        </div>
        <div class="flex flex-wrap gap-2 justify-center">
          @for (role of user().roles; track role) {
            <span class="bg-surface-elevated text-body-strong text-caption rounded-pill px-3 py-1">{{ role }}</span>
          }
        </div>
        <button
          class="inline-flex items-center gap-1.5 bg-surface-card text-on-dark rounded-lg px-4 py-2 h-9 text-sm font-semibold border border-hairline transition-colors hover:bg-surface-elevated active:border-hairline-strong"
        >
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
          Edit Profile
        </button>
      </div>

      <div class="hidden lg:block w-px self-stretch bg-hairline mx-6"></div>

      <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div>
          <span class="text-caption-uppercase text-muted-soft tracking-[1.5px]">Sex</span>
          <p class="text-body-md text-on-dark mt-1.5">{{ user().sex }}</p>
        </div>
        <div>
          <span class="text-caption-uppercase text-muted-soft tracking-[1.5px]">Age</span>
          <p class="text-body-md text-on-dark mt-1.5">{{ user().age }}</p>
        </div>
        <div>
          <span class="text-caption-uppercase text-muted-soft tracking-[1.5px]">Blood</span>
          <p class="text-body-md text-on-dark mt-1.5">{{ user().bloodType }}</p>
        </div>
        <div>
          <span class="text-caption-uppercase text-muted-soft tracking-[1.5px]">Registered Date</span>
          <p class="text-body-md text-on-dark mt-1.5">{{ user().registeredDate }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
