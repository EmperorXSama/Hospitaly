<nav class="navbar">
  <div class="nav-inner">
    <a href="#" class="logo">Hospitaly</a>

    <div class="nav-links">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }
    </div>

    <div class="nav-actions">
      @if (auth.isAuthenticated()) {
        <span class="user-name">{{ auth.profile()?.userName ?? auth.user()?.['name'] ?? auth.user()?.['sub'] }}</span>
        <a class="btn btn-secondary" routerLink="/profile">Profile</a>
        <button class="btn btn-secondary" (click)="logout()">Log out</button>
      } @else {
        <button class="btn btn-ghost" (click)="login()">Sign in</button>
        <a class="btn btn-primary" routerLink="/register">Register</a>
      }
    </div>
  </div>
</nav>
