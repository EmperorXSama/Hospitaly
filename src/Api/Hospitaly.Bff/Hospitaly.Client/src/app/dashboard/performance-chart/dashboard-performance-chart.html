<div class="bg-surface-card border border-hairline rounded-xl p-6">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-title-md text-on-dark">Clinic Performance</h2>
    <span class="text-caption text-muted bg-surface-elevated rounded-lg px-3 py-1">This Week</span>
  </div>

  <div class="flex items-end justify-between gap-3 h-48">
    @for (day of days; track day.day) {
      <div class="flex-1 flex flex-col items-center gap-2 h-full justify-end">
        <div #chartBars class="w-full flex flex-col items-center h-full justify-end">
          <div
            class="w-full bg-primary rounded-t-md"
            [style.height.%]="day.height"
            style="transform-origin: bottom center;"
          ></div>
        </div>
        <span class="text-caption text-muted text-center">{{ day.day }}</span>
      </div>
    }
  </div>

  <div class="mt-4 pt-4 border-t border-hairline flex items-center justify-between">
    <span class="text-body-sm text-muted">Patient & appointment activity</span>
    <span class="text-body-sm text-primary font-semibold">+8% vs last week</span>
  </div>
</div>
